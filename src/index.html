<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoNexus | Telemetry Dashboard</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>

    <style>
      /* This ensures the simulation fills the whole screen without scrollbars */
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
      }

      /* Styling for the sliders and checkboxes to make them look professional */
      input[type="range"] {
        cursor: pointer;
      }

      label {
        user-select: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <script src="sketch.js"></script>
  </body>
</html>
